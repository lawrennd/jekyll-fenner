name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  install-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install script tests
        run: bats scripts/test/install-test.bats

  fixture-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install Jekyll
        run: gem install jekyll jekyll-seo-tag --no-document
      - name: Path-1 fixture build
        run: ./scripts/pilot_build_fixture.sh
      - name: Path-2 fixture build
        run: ./scripts/pilot_build_fixture.sh --path2
